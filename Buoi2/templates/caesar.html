<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caesar Cipher</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            max-width: 700px;
            margin: auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        h2 {
            color: #1a3c6c;
            font-weight: 700;
            margin-bottom: 2rem;
        }
        h3 {
            color: #2c5282;
            font-weight: 600;
            margin: 2rem 0 1.5rem;
        }
        .form-control:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 0.25rem rgba(74, 144, 226, 0.25);
        }
        .btn-primary {
            background-color: #4a90e2;
            border-color: #4a90e2;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #357abd;
            border-color: #357abd;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
            border-color: #218838;
        }
        .result-box {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            border: 1px solid #dee2e6;
        }
        .form-label {
            font-weight: 500;
            color: #2d3748;
        }
        @media (max-width: 576px) {
            .form-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container form-container">
        <h2 class="text-center">Mã Hóa Caesar Cipher</h2>

        <!-- Form mã hóa -->
        <form action="" method="post" class="mb-4">
            <h3>Mã hóa</h3>
            <div class="mb-3">
                <label for="plain_text" class="form-label">Văn bản gốc:</label>
                <input type="text" class="form-control" id="plain_text" name="plain_text" placeholder="Nhập văn bản cần mã hóa" required>
            </div>
            <div class="mb-3">
                <label for="key_encrypt" class="form-label">Khóa (số nguyên):</label>
                <input type="number" class="form-control" id="key_encrypt" name="key" placeholder="Nhập khóa (1-25)" min="1" max="25" required>
            </div>
            <button type="submit" name="encrypt" class="btn btn-primary w-100">Mã hóa</button>
            
            
        </form>

        <hr />

        <!-- Form giải mã -->
        <form action="" method="post">
            <h3>Giải mã</h3>
            <div class="mb-3">
                <label for="cipher_text" class="form-label">Văn bản mã hóa:</label>
                <input type="text" class="form-control" id="cipher_text" name="cipher_text" placeholder="Nhập văn bản mã hóa" required>
            </div>
            <div class="mb-3">
                <label for="key_decrypt" class="form-label">Khóa (số nguyên):</label>
                <input type="number" class="form-control" id="key_decrypt" name="key" placeholder="Nhập khóa (1-25)" min="1" max="25" required>
            </div>
            <button type="submit" name="decrypt" class="btn btn-success w-100">Giải mã</button>
            
            
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
